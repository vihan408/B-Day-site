<!DOCTYPE html>
<html>
<head>
<title>Open when you can't sleep</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* 🌌 night gradient */
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    background-size:400% 400%;
    animation: bgMove 12s ease infinite;
}

/* background motion */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ⭐ stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:0.6;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.2; transform:scale(0.8);}
    to{opacity:1; transform:scale(1.2);}
}

/* card */
.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:25px;
    max-width:600px;
    text-align:center;
    backdrop-filter: blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    color:white;
    animation: fadeIn 1.2s ease;
    position:relative;
    z-index:2;
}

/* fade in */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* title glow */
h1{
    font-size:28px;
    text-shadow:0 0 15px rgba(255,255,255,0.3);
}

/* text */
p{
    font-size:16px;
    line-height:1.6;
    color:#e0e0e0;
}

/* image */
img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* button */
button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#ffffff;
    color:#111;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* subtle moon glow effect */
.card::before{
    content:"🌙";
    position:absolute;
    top:-30px;
    right:-30px;
    font-size:60px;
    opacity:0.2;
}
</style>
</head>

<body>

<!-- ⭐ stars -->
<script>
for(let i=0;i<80;i++){
    let star = document.createElement("div");
    star.classList.add("star");
    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*100 + "vh";
    star.style.animationDuration = (1 + Math.random()*2) + "s";
    document.body.appendChild(star);
}
</script>

<div class="card">

<h1>🌙 Open when you can't sleep</h1>

<p>
You don’t have to force sleep.<br>
Just rest. Let your mind slow down.<br><br>

Everything can wait until tomorrow.
</p>

<img src="images/photo1.jpg" alt="memory">

<p>
Close your eyes. Breathe slowly. You’re safe.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

</body>
</html>
