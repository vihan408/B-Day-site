<!DOCTYPE html> <html> <head> <title>Open when you can't sleep</title> <style> body{ margin:0; font-family:Arial, sans-serif; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; /* 🌌 deeper true night sky */ background:linear-gradient(135deg,#050816,#0a1a2f,#000814); background-size:400% 400%; animation: bgMove 18s ease infinite; } /* slow night drift */ @keyframes bgMove{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} } /* ⭐ glowing star (not just dot) */ .star{ position:absolute; width:3px; height:3px; background:white; border-radius:50%; opacity:0.8; animation: twinkle 2.5s infinite ease-in-out; box-shadow: 0 0 6px rgba(255,255,255,0.8), 0 0 12px rgba(180,220,255,0.6), 0 0 18px rgba(120,180,255,0.4); } /* twinkle effect */ @keyframes twinkle{ 0%{ opacity:0.3; transform:scale(0.8); box-shadow: 0 0 4px rgba(255,255,255,0.4), 0 0 8px rgba(180,220,255,0.3); } 50%{ opacity:1; transform:scale(1.3); box-shadow: 0 0 10px rgba(255,255,255,1), 0 0 20px rgba(180,220,255,0.8), 0 0 30px rgba(120,180,255,0.6); } 100%{ opacity:0.4; transform:scale(0.9); } } /* card */ .card{ background:rgba(255,255,255,0.08); padding:40px; border-radius:25px; max-width:600px; text-align:center; backdrop-filter: blur(14px); box-shadow:0 20px 50px rgba(0,0,0,0.5); color:white; animation: fadeIn 1.2s ease; position:relative; z-index:2; } /* fade */ @keyframes fadeIn{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} } /* title glow */ h1{ font-size:28px; text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(120,180,255,0.2); } /* text */ p{ font-size:16px; line-height:1.6; color:#d6e6ff; } /* image */ img{ width:220px; height:220px; object-fit:cover; border-radius:20px; margin:20px 0; box-shadow:0 15px 30px rgba(0,0,0,0.5); } /* button */ button{ padding:12px 22px; border:none; border-radius:12px; background:#ffffff; color:#0a1a2f; cursor:pointer; transition:0.3s; } button:hover{ transform:scale(1.05); } </style> </head> <body> <!-- ⭐ glowing stars --> <script> for(let i=0;i<120;i++){ let star = document.createElement("div"); star.classList.add("star"); // random position star.style.left = Math.random()*100 + "vw"; star.style.top = Math.random()*100 + "vh"; // random size (some stars bigger = depth) let size = 1 + Math.random()*3; star.style.width = size + "px"; star.style.height = size + "px"; // random animation delay star.style.animationDelay = Math.random()*3 + "s"; star.style.animationDuration = (2 + Math.random()*3) + "s"; document.body.appendChild(star); } </script> <div class="card"> <h1>🌙 Open when you can't sleep</h1> <p> You don’t have to force sleep.<br> Just rest. Let your thoughts slow down.<br><br> Everything can wait until tomorrow. </p> <img src="images/photo1.jpg" alt="memory"> <p> Close your eyes. You’re safe here. </p> <a href="home.html"><button>⬅ Back Home</button></a> </div> </body> </html>
