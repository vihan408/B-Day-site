<!DOCTYPE html>
<html>
<head>
<title>Open when you can't sleep</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:linear-gradient(135deg,#050816,#0a1a2f,#000814);
    background-size:400% 400%;
    animation:bgMove 18s ease infinite;
}

/* slow night drift */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ✨ STAR (sparkle style, not dots) */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:transparent;
    animation:twinkle 3s infinite ease-in-out;
}

/* cross sparkle shape */
.star::before,
.star::after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:2px;
    height:10px;
    background:white;
    border-radius:2px;
    box-shadow:0 0 8px rgba(255,255,255,0.9),
               0 0 14px rgba(180,220,255,0.7);
}

.star::before{
    transform:rotate(45deg);
}

.star::after{
    transform:rotate(-45deg);
}

/* twinkle */
@keyframes twinkle{
    0%{opacity:0.2; transform:scale(0.8);}
    50%{opacity:1; transform:scale(1.2);}
    100%{opacity:0.3; transform:scale(0.9);}
}

/* card */
.card{
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:25px;
    width:80%;
    max-width:850px;
    text-align:center;
    backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    color:white;
    z-index:2;
}

/* title glow */
h1{
    font-size:28px;
    text-shadow:0 0 10px rgba(255,255,255,0.3),
                0 0 20px rgba(120,180,255,0.2);
}

/* text */
p{
    font-size:16px;
    line-height:1.6;
    color:#d6e6ff;
}

/* SLIDESHOW */
.slideshow{
    position:relative;
    width:100%;
    height:420px;
    margin:25px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* slides */
.slide{
    position:absolute;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* button */
button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#ffffff;
    color:#0a1a2f;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- ✨ glowing stars -->
<script>
for(let i=0;i<120;i++){
    let star=document.createElement("div");
    star.classList.add("star");

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    let size=0.6+Math.random()*1.5;
    star.style.transform=`scale(${size})`;

    star.style.animationDuration=(2+Math.random()*3)+"s";
    star.style.animationDelay=Math.random()*3+"s";

    document.body.appendChild(star);
}
</script>

<div class="card">

<h1>🌙 Open when you can't sleep</h1>

<p>
Hey Viviene<br>
The moon is shining now, its time to sleep<br><br>
Sweet Dreams!
</p>

<!-- SLIDESHOW (centered) -->
<div class="slideshow">
    <img class="slide active" src="images/Sleep1.jpg">
    <img class="slide" src="images/Sleep2.jpg">
    <img class="slide" src="images/Sleep3.jpg">
    <img class="slide" src="images/Sleep4.jpg">
    <img class="slide" src="images/Sleep5.jpg">
    <img class="slide" src="images/Sleep6.jpg">
    <img class="slide" src="images/Sleep7.jpg">
    <img class="slide" src="images/Sleep8.jpg">
    <img class="slide" src="images/Sleep9.jpg">
    <img class="slide" src="images/Sleep10.jpg">
</div>

<p>
Close your eyes. You’re safe here.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

<script>
const slides=document.querySelectorAll(".slide");
let index=0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index=(index+1)%slides.length;
    slides[index].classList.add("active");
},4000);
</script>

</body>
</html>
