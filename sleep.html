<!DOCTYPE html>
<html>
<head>
<title>Sleep Mode 😴</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

img{
    position:absolute;
    max-width:90%;
    max-height:90%;
    object-fit:contain;
    opacity:0;
    transition:opacity 1s ease-in-out;
}

img.active{
    opacity:1;
}
</style>
</head>

<body>

<!-- Add sleep images here -->
<img src="images/Sleep1.jpg" class="active">
<!-- Future images go here -->
<!-- <img src="images/Sleep2.jpg"> -->
<!-- <img src="images/Sleep3.jpg"> -->

<script>
const slides = document.querySelectorAll("img");
let index = 0;

setInterval(() => {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000); // 4 seconds
</script>

</body>
</html>
