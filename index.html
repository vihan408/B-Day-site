<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    overflow:hidden;
}

/* fade-in animation */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

.container{
    background:rgba(255,255,255,0.2);
    padding:40px;
    border-radius:20px;
    backdrop-filter: blur(10px);
    animation: fadeIn 1s ease-out;
}

h1{
    margin-bottom:10px;
}

p{
    opacity:0.9;
}

/* button styling */
button{
    display:block;
    width:260px;
    margin:15px auto;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* soft floating background circles */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    animation: float 8s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-30px);}
    100%{transform:translateY(0);}
}
</style>
</head>

<body>

<!-- background decoration -->
<div class="circle" style="width:120px;height:120px;top:10%;left:10%;"></div>
<div class="circle" style="width:80px;height:80px;bottom:15%;right:15%;"></div>

<div class="container">

<h1>🎂 Happy Birthday</h1>
<p>Open these whenever you need them.</p>

<a href="sad.html"><button>💙 Open when you're sad</button></a>
<a href="sleep.html"><button>🌙 Open when you can't sleep</button></a>
<a href="motivation.html"><button>🚀 Open when you need motivation</button></a>
<a href="happy.html"><button>😊 Open when you're happy</button></a>

</div>

</body>
</html>
