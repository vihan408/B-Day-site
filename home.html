<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Viviene!</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    overflow:hidden;
}

.container{
    background:rgba(255,255,255,0.2);
    padding:40px;
    border-radius:20px;
    backdrop-filter: blur(10px);
    z-index:2;
    position:relative;
}

button{
    display:block;
    width:260px;
    margin:15px auto;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* confetti canvas */
#confetti{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

<h1>🎂 Birthday Surprise</h1>

<a href="sad.html"><button>💙 Open when you're sad</button></a>
<a href="sleep.html"><button>🌙 Open when you can't sleep</button></a>
<a href="motivation.html"><button>🚀 Open when you need motivation</button></a>
<a href="happy.html"><button>😊 Open when you're happy</button></a>

</div>

<script>
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces = [];

for (let i = 0; i < 150; i++) {
    pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 6 + 4,
        speed: Math.random() * 3 + 2,
        color: `hsl(${Math.random() * 360}, 70%, 60%)`
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let p of pieces) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);

        p.y += p.speed;

        if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
        }
    }

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
