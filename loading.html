<!DOCTYPE html>
<html>
<head>
<title>Welcome</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000428,#004e92);
    color:white;
    text-align:center;
    overflow:hidden;
}

/* animation */
@keyframes fadeIn {
    from {opacity:0; transform:scale(0.95);}
    to {opacity:1; transform:scale(1);}
}

.card{
    animation: fadeIn 1.2s ease;
}

/* image */
img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:10px;
    font-size:28px;
}

p{
    opacity:0.85;
}

/* dots animation */
.dots::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}
</style>
</head>

<body>

<div class="card">

<img src="images/photo1.jpg" alt="birthday photo">

<h1>Welcome to Viviene's Birthday 🎂</h1>

<p>Loading your surprise<span class="dots"></span></p>

</div>

<script>
setTimeout(() => {
    window.location.href = "index.html";
}, 3500);
</script>

</body>
</html>
