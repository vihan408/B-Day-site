<!DOCTYPE html>
<html>
<head>
<title>Open when you're happy</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:linear-gradient(135deg,#fff7cc,#ffecd2,#ffd6a5,#ffffff);
    background-size:400% 400%;
    animation:bgMove 8s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* floating emojis */
.emoji{
    position:absolute;
    font-size:24px;
    animation:floatUp linear infinite;
    opacity:0.8;
}

@keyframes floatUp{
    from{transform:translateY(100vh);opacity:0;}
    to{transform:translateY(-10vh);opacity:1;}
}

/* card */
.card{
    background:rgba(255,255,255,0.4);
    padding:40px;
    border-radius:25px;
    width:80%;
    max-width:850px;
    text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    z-index:2;
}

/* title glow */
h1{
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 10px #fff,0 0 20px #ffdf6b;}
    to{text-shadow:0 0 20px #fff,0 0 40px #ffb703;}
}

/* slideshow container */
.slideshow{
    position:relative;
    width:100%;
    height:420px;
    margin:25px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* images */
.slide{
    position:absolute;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* button */
button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#111;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🎉 floating emojis -->
<script>
const emojis=["🎉","😊","✨","💛","🎈","🥳"];

for(let i=0;i<50;i++){
    let e=document.createElement("div");
    e.className="emoji";
    e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=(3+Math.random()*4)+"s";
    e.style.fontSize=(16+Math.random()*20)+"px";
    document.body.appendChild(e);
}
</script>

<div class="card">

<h1>😊 Open when you're happy</h1>

<p>
Hold onto this moment.<br>
You deserve every bit of it.
</p>

<!-- SLIDESHOW -->
<div class="slideshow">

<img class="slide active" src="images/Happy1.jpg">
<img class="slide" src="images/Happy2.jpg">
<img class="slide" src="images/Happy3.jpg">
<img class="slide" src="images/Happy4.jpg">
<img class="slide" src="images/Happy5.jpg">
<img class="slide" src="images/Happy6.jpg">
<img class="slide" src="images/Happy7.jpg">
<img class="slide" src="images/Happy8.jpg">

</div>

<p>
Don’t rush past this feeling — stay in it.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

<script>
const slides=document.querySelectorAll(".slide");
let index=0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index=(index+1)%slides.length;
    slides[index].classList.add("active");
},4000);   // ✅ 4 seconds
</script>

</body>
</html>
