<!DOCTYPE html>
<html>
<head>
<title>Open when you need motivation</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* ⚡ strong energetic gradient */
    background:linear-gradient(135deg,#ff416c,#ff4b2b,#ff9a9e);
    background-size:400% 400%;
    animation: bgMove 8s ease infinite;
}

/* fast energetic movement */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ⚡ energy particles */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.8;
    animation: rise linear infinite;
    box-shadow:0 0 10px rgba(255,255,255,0.8);
}

@keyframes rise{
    from{transform:translateY(100vh) scale(0.8);}
    to{transform:translateY(-10vh) scale(1.3);}
}

/* card */
.card{
    background:rgba(255,255,255,0.15);
    padding:45px;
    border-radius:25px;
    max-width:650px;
    text-align:center;
    backdrop-filter: blur(15px);
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    animation: fadeIn 1s ease;
    z-index:2;
    position:relative;
}

/* fade in */
@keyframes fadeIn{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
}

/* 🔥 big bold title */
h1{
    font-size:34px;
    color:white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.6),
        0 0 25px rgba(255,80,80,0.8),
        0 0 40px rgba(255,0,0,0.5);
    animation: pulse 1.8s infinite;
}

/* pulse energy */
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

/* text */
p{
    font-size:17px;
    color:white;
    line-height:1.6;
}

/* image */
img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    animation: float 3s ease-in-out infinite;
}

/* floating image */
@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* button */
button{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    background:#111;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}
</style>
</head>

<body>

<!-- ⚡ particles -->
<script>
for(let i=0;i<70;i++){
    let p = document.createElement("div");
    p.classList.add("particle");
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (2 + Math.random()*3) + "s";
    p.style.animationDelay = Math.random()*2 + "s";
    document.body.appendChild(p);
}
</script>

<div class="card">

<h1>🚀 YOU'RE NOT DONE YET</h1>

<p>
You’ve already survived everything so far.<br><br>

That means you’re built for what’s next.<br>
Keep going — you’re closer than you think.
</p>

<img src="images/photo1.jpg" alt="memory">

<p>
One step. Then another. Don’t stop now.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

</body>
</html>
