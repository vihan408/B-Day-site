<!DOCTYPE html>
<html>
<head>
<title>Open when you need motivation</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* clean energetic gradient (no clutter) */
    background:linear-gradient(135deg,#ff512f,#dd2476,#ff9a9e);
    background-size:300% 300%;
    animation: bgMove 10s ease infinite;
}

/* smooth slow motion background */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* subtle glow overlay */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center, rgba(255,255,255,0.15), transparent 60%);
    animation: pulse 6s ease-in-out infinite;
}

@keyframes pulse{
    0%{opacity:0.4;}
    50%{opacity:0.8;}
    100%{opacity:0.4;}
}

/* card */
.card{
    background:rgba(255,255,255,0.12);
    padding:50px;
    border-radius:25px;
    max-width:650px;
    text-align:center;
    backdrop-filter: blur(16px);
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
    animation: fadeIn 1s ease;
    z-index:2;
    position:relative;
}

/* fade in */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* strong title */
h1{
    font-size:36px;
    color:white;
    font-weight:bold;
    letter-spacing:1px;
    text-shadow:
        0 0 10px rgba(255,255,255,0.6),
        0 0 25px rgba(255,80,120,0.8);
}

/* text */
p{
    font-size:18px;
    color:white;
    line-height:1.6;
}

/* image */
img{
    width:230px;
    height:230px;
    object-fit:cover;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    transition:0.3s;
}

img:hover{
    transform:scale(1.03);
}

/* button */
button{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.06);
}
</style>
</head>

<body>

<div class="card">

<h1>🚀 KEEP GOING</h1>

<p>
You’ve already survived 100% of your worst days so far.<br><br>

That means you can handle whatever comes next.<br>
Don’t stop now — you’re closer than you think.
</p>

<img src="images/photo1.jpg" alt="memory">

<p>
One step at a time. That’s enough.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

</body>
</html>
