<!DOCTYPE html>
<html>
<head>
<title>Open when you need motivation</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* 🔥 energetic deep gradient */
    background:linear-gradient(135deg,#ff512f,#ff2d55,#ff8a00,#ff3c6f);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

/* moving energy background */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* glowing energy mist overlay */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center,
        rgba(255,255,255,0.25),
        transparent 60%);
    animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{
    0%{opacity:0.3;}
    50%{opacity:0.7;}
    100%{opacity:0.3;}
}

/* ⚡ ENERGY STARS (more sharp, fast, bright) */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite ease-in-out;
    box-shadow:0 0 8px rgba(255,255,255,0.9),
               0 0 15px rgba(255,100,150,0.7);
}

@keyframes twinkle{
    0%{opacity:0.2; transform:scale(0.6);}
    50%{opacity:1; transform:scale(1.6);}
    100%{opacity:0.3; transform:scale(0.8);}
}

/* card */
.card{
    background:rgba(255,255,255,0.12);
    padding:50px;
    border-radius:25px;
    width:80%;
    max-width:850px;
    text-align:center;
    backdrop-filter:blur(16px);
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
    z-index:2;
    position:relative;
}

/* title glow (stronger = motivation vibe) */
h1{
    font-size:36px;
    color:white;
    text-shadow:0 0 10px rgba(255,255,255,0.6),
                0 0 30px rgba(255,80,120,0.9);
}

/* text */
p{
    font-size:18px;
    color:white;
    line-height:1.6;
}

/* SLIDESHOW */
.slideshow{
    position:relative;
    width:100%;
    height:420px;
    margin:25px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.slide{
    position:absolute;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* button */
button{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.06);
}
</style>
</head>

<body>

<!-- ⚡ energy stars -->
<script>
for(let i=0;i<140;i++){
    let star=document.createElement("div");
    star.classList.add("star");

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    let size=0.5+Math.random()*1.8;
    star.style.transform=`scale(${size})`;

    star.style.animationDuration=(1.5+Math.random()*2)+"s";
    star.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(star);
}
</script>

<div class="card">

<h1>🚀 KEEP GOING</h1>

<p>
You’ve already survived 100% of your worst days so far.<br><br>
That means you can handle whatever comes next.<br>
Don’t stop now — you’re closer than you think.
</p>

<!-- SLIDESHOW -->
<div class="slideshow">
    <img class="slide active" src="images/Motivation1.jpg">
    <img class="slide" src="images/Motivation2.jpg">
    <img class="slide" src="images/Motivation3.jpg">
    <img class="slide" src="images/Motivation4.jpg">
</div>

<p>
One step at a time. That’s enough.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

<script>
const slides=document.querySelectorAll(".slide");
let index=0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index=(index+1)%slides.length;
    slides[index].classList.add("active");
},4000);
</script>

</body>
</html>
