<!DOCTYPE html>
<html>
<head>
<title>Open when you're sad</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* 🌈 soft emotional gradient */
    background:linear-gradient(135deg,#a1c4fd,#c2e9fb,#fbc2eb);
    background-size:400% 400%;
    animation: bgMove 10s ease infinite;
}

/* background animation */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* floating glow blobs */
.blob{
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(255,255,255,0.3);
    border-radius:50%;
    filter:blur(40px);
    animation: float 8s ease-in-out infinite;
}

.blob:nth-child(1){top:10%; left:10%;}
.blob:nth-child(2){bottom:10%; right:15%; animation-delay:2s;}
.blob:nth-child(3){top:60%; left:70%; animation-delay:4s;}

@keyframes float{
    0%{transform:translateY(0px) scale(1);}
    50%{transform:translateY(-30px) scale(1.1);}
    100%{transform:translateY(0px) scale(1);}
}

/* card */
.card{
    background:rgba(255,255,255,0.25);
    padding:40px;
    border-radius:25px;
    max-width:600px;
    text-align:center;
    backdrop-filter: blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    animation: fadeIn 1s ease;
    position:relative;
    z-index:2;
}

/* fade */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* title glow */
h1{
    color:#1d3557;
    font-size:28px;
    text-shadow:0 0 10px rgba(255,255,255,0.8);
}

/* text */
p{
    color:#1d3557;
    font-size:16px;
    line-height:1.6;
}

/* image */
img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
    animation: float 5s ease-in-out infinite;
}

/* button */
button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#1d3557;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- floating blobs -->
<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<div class="card">

<h1>💙 Open when you're sad</h1>

<p>
Hey. You don’t have to fix everything right now.<br>
It’s okay to feel this. It’s okay to pause.<br><br>

You’re still doing better than you think.
And I’m proud of you for still being here.
</p>

<img src="images/photo1.jpg" alt="memory">

<p>
Take your time. Breathe. No pressure today.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

</body>
</html>
