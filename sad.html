<!DOCTYPE html>
<html>
<head>
<title>Open when you're sad</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:linear-gradient(135deg,#0b1d3a,#102a43,#1c3d5a);
    background-size:600% 600%;
    animation:bgMove 25s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 🌧 rain */
.rain{
    position:absolute;
    width:4px;
    height:45px;
    background:rgba(120,170,255,0.35);
    border-radius:5px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{transform:translateY(-120vh);}
    to{transform:translateY(120vh);}
}

/* glow blobs */
.blob{
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(120,160,255,0.15);
    border-radius:50%;
    filter:blur(50px);
    animation:float 10s ease-in-out infinite;
}

.blob:nth-child(1){top:10%;left:10%;}
.blob:nth-child(2){bottom:10%;right:15%;animation-delay:3s;}
.blob:nth-child(3){top:55%;left:65%;animation-delay:5s;}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-25px);}
    100%{transform:translateY(0px);}
}

/* card */
.card{
    background:rgba(255,255,255,0.12);
    padding:40px;
    border-radius:25px;
    width:80%;
    max-width:850px;
    text-align:center;
    backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    z-index:2;
}

/* text */
h1{
    color:#e6f0ff;
}

p{
    color:#d6e6ff;
    line-height:1.6;
}

/* slideshow */
.slideshow{
    position:relative;
    width:100%;
    height:420px;
    margin:25px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.slide{
    position:absolute;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* button */
button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#d6e6ff;
    color:#0b1d3a;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🌧 rain generator -->
<script>
for(let i=0;i<90;i++){
    let rain=document.createElement("div");
    rain.className="rain";
    rain.style.left=Math.random()*100+"vw";
    rain.style.animationDuration=(0.8+Math.random()*1.6)+"s";
    rain.style.opacity=0.2+Math.random()*0.4;
    rain.style.height=(35+Math.random()*25)+"px";
    document.body.appendChild(rain);
}
</script>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<div class="card">

<h1>💙 Open when you're sad</h1>

<p>
Hey. You don’t have to fix everything right now.<br>
Just exist for a moment. That’s enough.
</p>

<!-- SLIDESHOW -->
<div class="slideshow">

<img class="slide active" src="images/Sad1.jpg">
<img class="slide" src="images/Sad2.jpg">
<img class="slide" src="images/Sad3.jpg">
<img class="slide" src="images/Sad4.jpg">
<img class="slide" src="images/Sad5.jpg">
<img class="slide" src="images/Sad6.jpg">
<img class="slide" src="images/Sad7.jpg">
<img class="slide" src="images/Sad8.jpg">
<img class="slide" src="images/Sad9.jpg">
<img class="slide" src="images/Sad10.jpg">
<img class="slide" src="images/Sad11.jpg">
    

</div>

<p>
Take your time. Breathe slowly.<br>
Let it pass gently.
</p>

<a href="home.html"><button>⬅ Back Home</button></a>

</div>

<script>
const slides=document.querySelectorAll(".slide");
let index=0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index=(index+1)%slides.length;
    slides[index].classList.add("active");
},4000); // 4 seconds
</script>

</body>
</html>
