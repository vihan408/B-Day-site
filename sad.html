<!DOCTYPE html>
<html>
<head>
<title>Sad</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef2ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    max-width:600px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.1);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}

img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    margin:20px 0;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:#111;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>💙 Open when you're sad</h1>

<p>
Hey. You don’t have to fix everything right now.
Just breathe. You’re not alone.
</p>

<img src="images/photo1.jpg">

<a href="index.html"><button>⬅ Back</button></a>

</div>

</body>
</html>
